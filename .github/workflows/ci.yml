name: build

on:
  # Only rebuild the image when files that actually affect the Buildroot
  # output change. Skipping the build for changes that don't impact the
  # image (workflow/CI metadata, documentation, and the sb-enema runtime
  # shell code installed via the rootfs overlay) keeps PR feedback fast,
  # since a full image build can take ~15 minutes on GitHub runners.
  # Fast security scans (codacy, scorecard, dependency-review, lint) run
  # in their own workflows and are intentionally not gated by these
  # filters, so security coverage is unchanged.
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'sb_enema/board/sb-enema/rootfs-overlay/**'
      - '**.md'
      - 'LICENSE'
      - 'SecureBootChecker.ps1'
      - '.gitignore'
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'sb_enema/board/sb-enema/rootfs-overlay/**'
      - '**.md'
      - 'LICENSE'
      - 'SecureBootChecker.ps1'
      - '.gitignore'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            rsync cpio unzip wget xz-utils file python3-venv curl git \
            pkg-config libffi-dev mtools qemu-system-x86 ovmf

      # Ubuntu 26.04 ships uutils coreutils as the default `install`, and
      # Buildroot refuses to build against it (uutils/coreutils#12166 corrupts
      # installed files). Buildroot's own dependency check aborts with exactly
      # this remedy. Ubuntu 24.04 shipped GNU coreutils, so this is only needed
      # since the runner moved to 26.04.
      - name: Use GNU coreutils install
        run: |
          if install --version 2>&1 | grep -qi uutils; then
            sudo update-alternatives --install /usr/bin/install install /usr/bin/gnuinstall 100
          fi
          install --version | head -1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Extract Buildroot version
        run: echo "BUILDROOT_VERSION=$(grep '^BUILDROOT_VERSION' Makefile | cut -d= -f2 | xargs)" >> $GITHUB_ENV

      - name: Cache Buildroot tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/buildroot-*.tar.gz
          key: br-tarball-${{ env.BUILDROOT_VERSION }}

      - name: Cache Buildroot DL dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('sb_enema/configs/sb_enema_defconfig') }}
          restore-keys: br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache Buildroot host toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            output/br-out/host
            output/br-out/build/host-*/.stamp_*
          key: br-host-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('sb_enema/configs/sb_enema_defconfig', 'sb_enema/patches/**') }}
          restore-keys: |
            br-host-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-
            br-host-${{ runner.os }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          max-size: 4G

      - name: Build images
        run: |
          make -j$(nproc) BR2_CCACHE=y BR2_CCACHE_DIR=$GITHUB_WORKSPACE/.ccache BR2_CCACHE_USE_BASEDIR=y

      # Boots the image under OVMF and performs a real Custom-Owned enrollment,
      # then asserts the firmware variable store actually contains the
      # certificates we intended to enroll. Covers what the stubbed unit tests
      # cannot: efivarfs, the authenticated-variable write path, enrollment
      # order, and the pinned kernel actually booting.
      - name: QEMU enrollment test
        run: bash scripts/qemu-enroll-test.sh

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-serial-log
          path: /tmp/qemu-serial.log
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sb-enema-image
          path: output/br-out/images/sb-enema.img
          if-no-files-found: error
          retention-days: 7
