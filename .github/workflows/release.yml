name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Stamp version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          esc_version="${version//\//\\/}"
          esc_version="${esc_version//&/\\&}"
          sed -i "s|^VERSION=\"@@VERSION@@\"|VERSION=\"${esc_version}\"|" sb_enema/board/sb-enema/rootfs-overlay/usr/sbin/sb-enema

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev \
            rsync cpio unzip zip wget xz-utils file python3-venv curl git \
            pkg-config libffi-dev mtools

      # Ubuntu 26.04 ships uutils coreutils as the default `install`, and
      # Buildroot refuses to build against it (uutils/coreutils#12166 corrupts
      # installed files). Buildroot's own dependency check aborts with exactly
      # this remedy. Ubuntu 24.04 shipped GNU coreutils, so this is only needed
      # since the runner moved to 26.04.
      - name: Use GNU coreutils install
        run: |
          if install --version 2>&1 | grep -qi uutils; then
            sudo update-alternatives --install /usr/bin/install install /usr/bin/gnuinstall 100
          fi
          install --version | head -1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Extract Buildroot version
        run: echo "BUILDROOT_VERSION=$(grep '^BUILDROOT_VERSION' Makefile | cut -d= -f2 | xargs)" >> $GITHUB_ENV

      - name: Cache Buildroot tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/buildroot-*.tar.gz
          key: br-tarball-${{ env.BUILDROOT_VERSION }}

      - name: Cache Buildroot DL dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('sb_enema/configs/sb_enema_defconfig') }}
          restore-keys: br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Cache Buildroot host toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            output/br-out/host
            output/br-out/build/host-*/.stamp_*
          key: br-host-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('sb_enema/configs/sb_enema_defconfig', 'sb_enema/patches/**') }}
          restore-keys: |
            br-host-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-
            br-host-${{ runner.os }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          max-size: 4G

      - name: Build images
        run: |
          make -j$(nproc) BR2_CCACHE=y BR2_CCACHE_DIR=$GITHUB_WORKSPACE/.ccache BR2_CCACHE_USE_BASEDIR=y dist

      - name: Run Trivy rootfs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: output/br-out/target
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-rootfs.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-rootfs.sarif
          category: trivy-rootfs

      - name: Create SBOM output dir
        run: mkdir -p ${{ github.workspace }}/sbom
      
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: output/br-out/target/
          format: spdx-json
          output-file: "${{ github.workspace }}/sbom/sbom.spdx.json"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sb-enema.zip
            dist/SHA256SUMS
            sbom/sbom.spdx.json

      - name: Stage attestation bundle for release
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             dist/sb-enema.intoto.jsonl

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/sb-enema.zip
            dist/sb-enema.intoto.jsonl
            dist/README.md
            dist/SHA256SUMS
            sbom/sbom.spdx.json
            trivy-rootfs.sarif

      - name: SBOM upload
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: "${{ github.workspace }}/sbom/"
