name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning
          ignore_paths: third_party

  # The scripts/test-*.sh suite exercises the runtime enrollment logic in
  # sb_enema/board/sb-enema/rootfs-overlay/, which the build workflow
  # deliberately excludes via paths-ignore.  Without this job those tests never
  # run in CI — including test-cert-policy.sh, which is the guard against
  # silently dropping a certificate that machines need in order to boot.
  unit-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # test-cert-policy.sh reads the real Microsoft certificates out of the
          # secureboot_objects submodule; without it the test skips itself.
          submodules: recursive

      - name: Run test suite
        run: |
          status=0
          for test in scripts/test-*.sh; do
            echo "::group::${test}"
            if bash "${test}"; then
              echo "${test}: PASS"
            else
              echo "::error file=${test}::${test} failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
