# @file
# Template Name: SB-ENEMA Recovery — Microsoft chain, recovery-safe
# 
# This is SB-ENEMA's own keystore template.  It is deliberately NOT one of the
# stock microsoft/secureboot_objects templates, because none of them match what
# a *recovery* tool needs.  It lives outside third_party/ so a submodule bump
# cannot silently change enrollment policy.
# 
# Consumed by scripts/prepare-secureboot-objects.sh, which runs
# secureboot_objects/scripts/secure_boot_default_keys.py with the submodule as
# the working directory.  Every `path` below is therefore relative to the
# submodule root, exactly as in the stock templates.
# 
# ---------------------------------------------------------------------------
# Why this exists rather than a stock template
# ---------------------------------------------------------------------------
# db: MostCompatible is the only stock template that keeps "Microsoft Windows
#     Production PCA 2011", and that certificate is mandatory here — see the
#     [DB] notes below.  We take MostCompatible's db verbatim.
# 
# KEK: no stock template matches.  Every stock template except the deprecated
#     LegacyFirmwareDefaults ships the 2023 KEK *only*.  That is correct for
#     factory provisioning of a new machine, but wrong for a tool that
#     re-provisions a machine already in the field: as of 2026-07 every
#     Microsoft-published Secure Boot servicing package is still signed under
#     the 2011 KEK.  Verified directly against the vendored submodule —
#     PostSignedObjects/DBX/{x86,amd64,arm,arm64}/DBXUpdate.bin all carry a
#     PKCS#7 signer chaining "Microsoft Windows UEFI Key Exchange Key" ->
#     "Microsoft Corporation KEK CA 2011".  Zero packages chain to the 2023
#     KEK.  A machine holding only the 2023 KEK therefore cannot apply any
#     Microsoft dbx revocation update that currently exists, and would sit on a
#     frozen revocation list indefinitely.  So we ship both.
# 
# Certificate expiry is deliberately NOT a reason to drop anything here.  UEFI
# image verification does not check X.509 validity dates: the spec's
# authorization process (§32.5) has no expiry step, and edk2's Pkcs7Verify()
# passes X509_V_FLAG_NO_CHECK_TIME precisely so that a dead CMOS battery cannot
# brick a machine.  Revocation is expressed through dbx and only through dbx.
# An expired-but-unrevoked CA in db still validates the binaries it signed, and
# dropping it buys no security while breaking those binaries.
# 
# Review date: 2026-10-19 (Windows Production PCA 2011 notAfter).  Revisit the
# db entry below once Microsoft's 2023 boot-manager rollout has completed and
# Microsoft ships the PCA 2011 revocation in the default dbx rather than the
# opt-in DBXUpdate2024 package.
# 
# SPDX-License-Identifier: BSD-2-Clause-Patent
# (Derived from microsoft/secureboot_objects Templates/MostCompatible.toml,
#  Copyright (C) Microsoft Corporation.)
# 
