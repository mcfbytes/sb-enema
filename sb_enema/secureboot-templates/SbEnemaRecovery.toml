description = "2011 signed third-party UEFI applications and option ROMs (shims and add-in cards in the field)"

############################
# DBX — Forbidden          #
############################
[DBX]
help = "Microsoft's revocation list, filtered per architecture."

# Unlike the certificate entries above, this source file legitimately changes
# whenever Microsoft publishes new revocations, so the hashes below must be
# refreshed on every secureboot_objects bump.  That is deliberate: a change to
# what is revoked is a policy change worth a human look, since a dbx entry can
# stop a machine booting.  prepare-secureboot-objects.sh fails the build until
# they are updated.  Review the delta before refreshing -- in particular whether
# the "certificates" and "svns" lists changed, not just the image hashes.
#
#   sha256sum third_party/secureboot_objects/PreSignedObjects/DBX/dbx_info_msft_latest.json
#   sha1sum   third_party/secureboot_objects/PreSignedObjects/DBX/dbx_info_msft_latest.json
#
# Note that every stock Microsoft template still declares
# 0x8818A4486178E0B253FBBB6F0A9E64DC144E2480 here, which has been stale since
# upstream last updated this file (2025-10-24).  Their generator ignores the
# field, so nothing upstream noticed; ours checks it, so the value below is the
# real one.
[[DBX.files]]
path = "PreSignedObjects/DBX/dbx_info_msft_latest.json"
sha1 = 0x08C2CF1601BDC27A6116FE43087403D1135755A4
sha256 = "1020f0ef865f8cf22740298d928a01355ab51cb1d8d473b637fd6d83f74eb3f5"
signature_owner = "77fa9abd-0359-4d32-bd60-28f4e78f784b"
