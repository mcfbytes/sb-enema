# Required for compatibility, not optional.  This CA signs the Windows Boot
# Manager on every Windows installation that has not yet received Microsoft's
# 2023-signed boot manager — a rollout that is staged and, as of 2026-07, still
# incomplete.  It also covers WinRE, installation media, and recovery/PXE images
# created before the 2023 migration.  Omitting it leaves an otherwise healthy
# Windows install unbootable with Secure Boot on, which is the single worst
# outcome for a recovery tool.  Note that firmware ships this in dbDefault too.
[[DB.files]]
path = "PreSignedObjects/DB/Certificates/MicWinProPCA2011_2011-10-19.der"
url = "https://go.microsoft.com/fwlink/p/?linkid=321192"
sha1 = 0x580A6F4CC4E4B669B9EBDC1B2B3E087B80D0678D
sha256 = "e8e95f0733a55e8bad7be0a1413ee23c51fcea64b3c8fa6a786935fddcc71961"
signature_owner = "77fa9abd-0359-4d32-bd60-28f4e78f784b"
description = "2011 signed Windows boot media (Windows Boot Manager on unmigrated installs)"

[[DB.files]]
path = "PreSignedObjects/DB/Certificates/MicCorUEFCA2011_2011-06-27.der"
url = "https://go.microsoft.com/fwlink/p/?linkid=321194"
sha1 = 0x46DEF63B5CE61CF8BA0DE2E6639C1019D0ED14F3
sha256 = "48e99b991f57fc52f76149599bff0a58c47154229b9f8d603ac40d3500248507"
