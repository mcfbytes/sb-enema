# @file
# Template Name: SB-ENEMA Hardened — 2023-only, full revocations
#
# OPT-IN ONLY.  This is NOT the default; sb_enema/secureboot-templates/
# SbEnemaRecovery.toml is.  Select it explicitly:
#
#   KEYSTORE=sb_enema/secureboot-templates/SbEnemaHardened.toml \
#       scripts/prepare-secureboot-objects.sh
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE USING IT
# ---------------------------------------------------------------------------
# This profile enrolls the certificate-class and SVN revocations that Microsoft
# publishes but ships only in the explicitly optional DBXUpdate2024 package,
# and correspondingly drops the 2011 certificates from db.
#
# A machine provisioned this way will REFUSE TO BOOT:
#
#   * any Windows installation whose boot manager has not yet been migrated to
#     Windows UEFI CA 2023 -- the rollout is staged and, as of 2026-07, still
#     incomplete;
#   * Windows installation and recovery media created before that migration,
#     including WinRE and PXE/WDS images;
#   * any Windows Boot Manager whose embedded SVN is below the enrolled floor,
#     even if it is 2023-signed;
#   * Linux shims and PCIe option ROMs still signed only under the 2011
#     third-party UEFI CA, which is most of what is in the field today.
#
# Microsoft's own warning for the equivalent package is that a device applying
# it "will be unable to boot existing Windows boot media".
#
# Use this only on a machine you have verified is fully migrated, where you
# want the pre-2023 attack surface (CVE-2023-24932 / BlackLotus and the
# bootloaders below the SVN floor) closed. For a recovery tool run against
# someone else's machine, SbEnemaRecovery.toml is the correct choice.
#
# ---------------------------------------------------------------------------
# Why the two halves are coupled
# ---------------------------------------------------------------------------
# A dbx match beats a db match, so revoking a certificate that db still trusts
# produces a key set where the db entry is dead weight and everything signed by
# that CA stops booting. Enrolling the revocations therefore REQUIRES dropping
# the corresponding db entries, which is why this file does both.
# scripts/check-secureboot-policy.py enforces the coupling and fails the build
# if a certificate ever appears in both.
#
# KEK keeps both Microsoft KEKs for the same reason as the recovery profile:
# every Microsoft servicing package published to date is signed under the 2011
# KEK, and it is not revoked by anything.
#
# SPDX-License-Identifier: BSD-2-Clause-Patent
# (Derived from microsoft/secureboot_objects, Copyright (C) Microsoft Corporation.)
#
################################
# PK — Platform Key            #
################################
[PK]
help = "Microsoft's Windows OEM Devices PK. Enrolled only on the Microsoft-owned path; the custom-owned path replaces this with a user-generated PK."

[[PK.files]]
path = "PreSignedObjects/PK/Certificate/WindowsOEMDevicesPK.der"
sha1 = 0x3D8660C0CB2D57B189C3D7995572A552F75E48B5
sha256 = "2f569e8edaf9657dc4951c29598725255c7f821472db71374211fe44d082546f"
signature_owner = "77fa9abd-0359-4d32-bd60-28f4e78f784b"
description = "Platform Key (owner) who may authorize changes to the KEK Variable"

###################################
# KEK — Key Exchange Keys         #
###################################
[KEK]
help = "Both Microsoft KEKs. The 2023 KEK is the forward-looking anchor; the 2011 KEK is what every currently-published Microsoft db/dbx servicing package is actually signed under."

[[KEK.files]]
